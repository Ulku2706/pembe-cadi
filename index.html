<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İyi ki Doğdun Pembe Cadı 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050208;
      font-family: sans-serif;
      color: #fff;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #message-box {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      z-index: 10;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      pointer-events: none;
    }
    #message-box.visible {
      opacity: 1;
    }
    .witch-title {
      font-size: 32px;
      font-weight: bold;
      color: #ff80bf;
      text-shadow: 0 0 20px rgba(255, 42, 141, 0.8), 0 0 40px rgba(255, 20, 147, 0.6);
      letter-spacing: 1px;
    }
    .witch-sub {
      font-size: 13px;
      color: #ffd1dc;
      margin-top: 6px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    #start-btn-container {
      position: fixed;
      inset: 0;
      background: #050208;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      cursor: pointer;
    }
    .open-gift-btn {
      background: linear-gradient(135deg, #ff1493, #ff69b4);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      padding: 16px 36px;
      border-radius: 50px;
      border: none;
      box-shadow: 0 0 30px rgba(255, 20, 147, 0.7);
      cursor: pointer;
    }
    .hint-text {
      margin-top: 15px;
      font-size: 13px;
      color: rgba(255, 192, 203, 0.7);
    }
  </style>
</head>
<body>

  <div id="start-btn-container">
    <button class="open-gift-btn">✨ Sürprizi Başlat ✨</button>
    <div class="hint-text">🎵 Müzikli deneyim için dokun</div>
  </div>

  <canvas id="heartCanvas"></canvas>

  <div id="message-box">
    <div class="witch-title">iyi ki doğdun pembe cadı 💕</div>
    <div class="witch-sub">✨ sonunda 20 olabildiiin> ✨</div>
  </div>

  <script>
    // --- 1. MÜZİK MOTORU (Web Audio Synthesizer) ---
    let audioCtx = null;
    let isPlaying = false;

    const chords = [
      [261.63, 329.63, 392.00], // Do Majör
      [220.00, 261.63, 329.63], // La Minör
      [174.61, 220.00, 261.63], // Fa Majör
      [196.00, 246.94, 293.66]  // Sol Majör
    ];

    function playNote(freq, start, dur) {
      if (!audioCtx || !isPlaying) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.08, start + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + dur);
      } catch (e) {}
    }

    let step = 0;
    function loopMusic() {
      if (!isPlaying) return;
      const now = audioCtx.currentTime;
      const chord = chords[step % chords.length];
      chord.forEach((note, i) => {
        playNote(note, now + i * 0.4, 2.0);
        playNote(note * 1.5, now + 1.2 + i * 0.3, 1.5);
      });
      step++;
      setTimeout(loopMusic, 3200);
    }

    function initAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        isPlaying = true;
        loopMusic();
      }
    }

    // --- 2. KALP ANİMASYONU ---
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function heartMath(a, scale) {
      const x = 16 * Math.pow(Math.sin(a), 3) * scale;
      const y = -(13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) * scale;
      return { x, y };
    }

    const lines = [];
    const TOTAL_LINES = 5000;
    let count = 0;

    function createLines() {
      const isMobile = width < 600;
      const scale = isMobile ? 10 : 14;

      for (let i = 0; i < TOTAL_LINES; i++) {
        const isOuter = i > 3800;
        const a = Math.random() * Math.PI * 2;
        const rFactor = isOuter ? 1 : Math.pow(Math.random(), 0.6);
        const pt = heartMath(a, scale * (isOuter ? 1 : rFactor));

        const ang = Math.atan2(pt.y, pt.x) + (Math.random() - 0.5) * (isOuter ? 0.6 : 0.9);
        const len = isOuter ? (10 + Math.random() * 18) : (4 + Math.random() * 10);
        const g = Math.floor(60 + Math.random() * 80);
        const b = Math.floor(160 + Math.random() * 60);

        lines.push({
          pt: pt,
          ang: ang,
          len: len,
          color: `rgba(255, ${g}, ${b}, ${0.5 + Math.random() * 0.45})`,
          width: isOuter ? 1.0 : 0.6
        });
      }
    }

    let startTime = null;

    function animate(t) {
      if (!startTime) startTime = t;
      const elapsed = (t - startTime) / 1000;

      ctx.fillStyle = 'rgba(5, 2, 8, 0.3)';
      ctx.fillRect(0, 0, width, height);

      // Yavaş yavaş çizilme
      if (count < TOTAL_LINES) {
        count = Math.min(count + 25, TOTAL_LINES);
      } else {
        document.getElementById('message-box').classList.add('visible');
      }

      // Nefes alma / nabız ritmi
      const pulse = 1 + 0.04 * Math.sin(elapsed * 3.5) * Math.pow(Math.sin(elapsed * 1.75), 2);

      const cx = width / 2;
      const cy = height / 2 - 20;

      for (let i = 0; i < count; i++) {
        const l = lines[i];
        const x1 = cx + l.pt.x * pulse;
        const y1 = cy + l.pt.y * pulse;
        const x2 = x1 + Math.cos(l.ang) * (l.len * pulse);
        const y2 = y1 + Math.sin(l.ang) * (l.len * pulse);

        ctx.beginPath();
        ctx.strokeStyle = l.color;
        ctx.lineWidth = l.width;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      requestAnimationFrame(animate);
    }

    // --- 3. BAŞLATMA ---
    const btn = document.getElementById('start-btn-container');
    btn.addEventListener('click', () => {
      btn.style.display = 'none';
      initAudio();
      createLines();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>

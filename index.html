<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 💖 İyi ki Doğdun Pembe Cadııı 🩷 </title> 
    <link href="https://fonts.googlepis.com/css2?family=Fira+Code:wght@400;500&family=Pacifico&family=Quicksand:wght&600;700&display=swap" rel="stylesheet">
    <style>
      *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
       }
        body,html{
          width: 100%;
          height: 100%;
          overflow: hidden;
          background-color: #0c0d11;
          font-family: 'Fira Code', monospace;
          color: #fff;
        }
      #main-container{
        display: flex;
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      .heart-panel{
        flex: 1.1;
        position: relative;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      #heart-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .code-panel {
        flex: 0.9;
        background: #18191f;
        display: flex;
        flex-direction: column;
        border-left: 1px solid rgba(255, 255, 255, 0.88);
        box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        z-index: 5;
      }
      .editor-topbar {
        height: 38px;
        background: #131418;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .win-dot{
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .w-red{ background: #ff5f56; }
      .w-yellow { background: #ffbd2e; }
      .w-green { background: #27c93f; }
      .editor-filename { 
        font-size: 12px;
        color: #7b7f94;
        margin-left: 10px;
      }
        
      
          
    </style>
  </head>

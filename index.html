 <!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İyi ki Doğdun Pembe Cadı 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #120919 0%, #050208 100%);
      font-family: 'Quicksand', sans-serif;
      color: #fff;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Alttaki Yazı */
    #message-box {
      position: absolute;
      bottom: 50px;
      width: 100%;
      text-align: center;
      z-index: 20;
      opacity: 0;
      transform: translateY(25px);
      transition: all 2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #message-box.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .witch-title {
      font-family: 'Pacifico', cursive;
      font-size: 40px;
      background: linear-gradient(135deg, #ffffff 0%, #ff9ec2 45%, #ff2a8d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(255, 42, 141, 0.7));
      letter-spacing: 1px;
    }
    .witch-sub {
      font-size: 14px;
      color: #ffd1dc;
      margin-top: 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      opacity: 0.85;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
    }

    /* Açılış Perdesi */
    #entrance-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1f0b29 0%, #06020a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      cursor: pointer;
      transition: opacity 0.9s ease, visibility 0.9s;
    }
    #entrance-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .open-gift-btn {
      background: linear-gradient(135deg, #ff1493, #ff69b4);
      color: #fff;
      font-size: 19px;
      font-weight: 700;
      padding: 18px 42px;
      border-radius: 50px;
      border: none;
      box-shadow: 0 0 35px rgba(255, 20, 147, 0.65), inset 0 0 10px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      animation: pulseBtn 2s infinite;
      letter-spacing: 0.5px;
    }
    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 20, 147, 0.6); }
      50% { transform: scale(1.06); box-shadow: 0 0 45px rgba(255, 105, 180, 0.9); }
    }
    .hint-text {
      margin-top: 18px;
      font-size: 13px;
      color: rgba(255, 192, 203, 0.7);
    }

    @media (max-width: 600px) {
      .witch-title { font-size: 28px; }
      .witch-sub { font-size: 12px; }
      #message-box { bottom: 35px; }
    }
  </style>
</head>
<body>

  <!-- Başlangıç Butonu -->
  <div id="entrance-screen">
    <button class="open-gift-btn">✨ Sürprizi Başlat ✨</button>
    <div class="hint-text">🎵 Müzikli deneyim için dokun</div>
  </div>

  <div id="canvas-container">
    <canvas id="heartCanvas"></canvas>
  </div>

  <div id="message-box">
    <div class="witch-title">iyi ki doğdun pembe cadı 💕</div>
    <div class="witch-sub">✨ nice mutlu, ışıltılı yaşlara ✨</div>
  </div>

  <script>
    // --- 1. SES MOTORU (Web Audio Synthesizer - Antent Stili Ambient Melodi) ---
    let audioCtx = null;
    let isPlaying = false;

    const chords = [
      [261.63, 329.63, 392.00, 523.25], // Cmaj
      [220.00, 261.63, 329.63, 440.00], // Amin
      [174.61, 220.00, 261.63, 349.23], // Fmaj
      [196.00, 246.94, 293.66, 392.00]  // Gmaj
    ];

    function playSynthNote(freq, time, dur) {
      if (!audioCtx || !isPlaying) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, time);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(0.09, time + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(time);
      osc.stop(time + dur);
    }

    let chordStep = 0;
    function scheduleAmbientMusic() {
      if (!isPlaying) return;
      const now = audioCtx.currentTime;
      const chord = chords[chordStep % chords.length];

      // Arpej vuruşları
      chord.forEach((note, i) => {
        playSynthNote(note, now + i * 0.45, 2.2);
        playSynthNote(note * 1.5, now + 1.8 + i * 0.35, 1.8);
      });

      chordStep++;
      setTimeout(scheduleAmbientMusic, 3600);
    }

    function startMusic() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isPlaying = true;
      scheduleAmbientMusic();
    }

    // --- 2. CANLI NEFES ALAN IŞINSAL KALP ANİMASYONU ---
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function heartMath(a, scale) {
      const x = 16 * Math.pow(Math.sin(a), 3) * scale;
      const y = -(13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) * scale;
      return { x, y };
    }

    class LineSpark {
      constructor(isOuter, baseScale) {
        this.isOuter = isOuter;
        this.a = Math.random() * Math.PI * 2;
        this.scaleRatio = isOuter ? 1 : Math.pow(Math.random(), 0.6);
        this.pt = heartMath(this.a, baseScale * (isOuter ? 1 : this.scaleRatio));

        this.ang = Math.atan2(this.pt.y, this.pt.x) + (Math.random() - 0.5) * (isOuter ? 0.7 : 0.9);
        this.length = isOuter ? (10 + Math.random() * 20) : (4 + Math.random() * 12);
        this.width = isOuter ? (0.7 + Math.random() * 0.8) : (0.4 + Math.random() * 0.7);

        // Canlı pembe / eflatun tonları
        this.g = Math.floor(60 + Math.random() * 90);
        this.b = Math.floor(160 + Math.random() * 70);
        this.alpha = 0.5 + Math.random() * 0.45;
        this.phase = Math.random() * Math.PI * 2;
      }

      draw(pulse, breatheTime) {
        // Canlı nefes alma ve hafif ışıma salınımı
        const currentPulse = pulse + Math.sin(breatheTime + this.phase) * 0.02;
        const x1 = (width / 2) + this.pt.x * currentPulse;
        const y1 = (height / 2 - 20) + this.pt.y * currentPulse;

        const x2 = x1 + Math.cos(this.ang) * (this.length * currentPulse);
        const y2 = y1 + Math.sin(this.ang) * (this.length * currentPulse);

        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, ${this.g}, ${this.b}, ${this.alpha})`;
        ctx.lineWidth = this.width;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }

    let allSparks = [];
    let revealedCount = 0;
    const TOTAL_SPARKS = 5500;

    function buildHeartModel() {
      allSparks = [];
      const isMobile = window.innerWidth < 600;
      const baseScale = isMobile ? 10.5 : 15;

      for (let i = 0; i < TOTAL_SPARKS; i++) {
        const isOuter = i > 4200;
        allSparks.push(new LineSpark(isOuter, baseScale));
      }
    }

    let startTime = null;

    function loop(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;

      // Arka planı hafif saydam temizleyerek neon parıltı bırakma
      ctx.fillStyle = 'rgba(6, 3, 10, 0.35)';
      ctx.fillRect(0, 0, width, height);

      // Yavaş yavaş çizilme (her karede 24 ışın eklenir)
      if (revealedCount < TOTAL_SPARKS) {
        revealedCount = Math.min(revealedCount + 24, TOTAL_SPARKS);
      } else {
        document.getElementById('message-box').classList.add('visible');
      }

      // Canlı Kalp Atışı (Nefes Alma Ritmi)
      const t = elapsed / 1000;
      const heartbeat = 1 + 0.05 * Math.sin(t * 3.2) * Math.pow(Math.sin(t * 1.6), 2);

      // Parçacıkları çiz
      for (let i = 0; i < revealedCount; i++) {
        allSparks[i].draw(heartbeat, t * 2.5);
      }

      requestAnimationFrame(loop);
    }

    // --- 3. BAŞLATMA ---
    const entrance = document.getElementById('entrance-screen');

    entrance.addEventListener('click', () => {
      entrance.classList.add('hide');
      startMusic();
      buildHeartModel();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
